# Rebuilds the profile card, the link buttons and the Pac-Man board.
#
# fetch_stats.py reads public numbers from the GitHub GraphQL API into
# cache/stats.json; the build_*.py scripts turn that into the SVGs the README
# displays. Everything is committed back, so the profile always shows fresh data.
name: Update Profile Card

on:
  schedule:
    - cron: "17 5 * * *" # once a day
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch GitHub stats
        env:
          # Optional: a personal token with read:user (secret STATS_TOKEN) also
          # counts private contributions. The built-in token covers all public data.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py

      - name: Rebuild the SVGs
        working-directory: tools
        run: |
          python build_card.py
          python build_pacman.py
          python build_links.py

      - name: Rebase onto anything pushed meanwhile
        run: git pull --rebase --autostash origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile card"
          branch: main
          file_pattern: "*.svg cache/*.json"
